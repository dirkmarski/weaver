<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sudoku</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Sudoku</h1>
    <section id="picker" aria-labelledby="picker-title">
      <h2 id="picker-title">Choose a difficulty</h2>
      <p>
        <button type="button" data-level="easy">Easy</button>
        <button type="button" data-level="medium">Medium</button>
        <button type="button" data-level="tricky">Tricky</button>
        <button type="button" data-level="hard">Hard</button>
      </p>
    </section>
    <section id="game" hidden>
      <p id="level"></p>
      <table id="sudoku"><caption>Fill in the empty cells so every row, column and box holds 1-9</caption></table>
      <p><button id="verify" type="button">Verify</button> <button id="hint" type="button">Hint</button> <button id="notes" type="button" title="Toggle notes (N)" aria-pressed="false">Notes: Off</button> <button id="new-puzzle" type="button">New puzzle</button></p>
    </section>
    <p id="status" role="status"></p>
    <section id="tally" hidden>
      <h2></h2>
      <p id="tally-naked"></p>
      <p class="definition" id="definition-naked"></p>
      <p id="tally-hidden"></p>
      <p class="definition" id="definition-hidden"></p>
      <p id="tally-pointing"></p>
      <p class="definition" id="definition-pointing"></p>
    </section>
  </main>
  <script src="sudoku.js"></script>
</body>
</html>
